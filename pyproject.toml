[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onc-causal-inference"
version = "0.1.0"
description = "Causal inference from clinical text using frozen LLM feature extraction"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    {name = "Ken Kehl", email = "kenneth_kehl@dfci.harvard.edu"}
]
keywords = ["causal inference", "machine learning", "clinical text", "nlp", "oncology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=5.3.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    # LogisticRegression.multi_class is still used by the Stage 1 scientific
    # configuration and was removed in scikit-learn 1.8.
    "scikit-learn>=1.2.0,<1.8.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.65.0",
    "pyarrow",
    "joblib>=1.2.0",
    "accelerate>=0.20.0",
    # 5.4+ probes the optional TorchCodec backend at import time. vLLM installs
    # TorchCodec, whose native libraries require system FFmpeg even for our
    # text-only embedding use case. 5.3 supports Transformers v5 without that
    # multimodal import path.
    "sentence-transformers>=5.3.0,<5.4.0",
    "huggingface-hub>=1.0.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.5.0",
    "jsonschema==4.26.0",
    "openai>=1.0.0",
    "econml>=0.14.0",
    "llvmlite>=0.46.0",
    "numba>=0.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
extraction = [
    "google-auth[requests]>=2.0.0",
]
local-llm = [
    "vllm>=0.20.1",
    "openai-harmony>=0.0.8",
    # Match the locked PyTorch/vLLM CUDA 13.0 runtime. FlashInfer compiles
    # Blackwell kernels at startup, so the runtime libraries alone are not enough.
    "cuda-toolkit[nvcc,cccl,crt,nvvm]==13.0.2; sys_platform == 'linux'",
]
gemini = [
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.0.0",
]

[project.scripts]
oci = "oci.cli:main"
oci-evaluate-stage1 = "oci.evaluation.stage1:main"

[project.urls]
Homepage = "https://github.com/kenlkehl/onc-causal-inference"
Documentation = "https://github.com/kenlkehl/onc-causal-inference"
Repository = "https://github.com/kenlkehl/onc-causal-inference"

[tool.setuptools.packages.find]
include = ["oci", "oci.*", "synthetic_data", "synthetic_data.*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["artifacts", ".git", ".agents", ".codex"]
